name: containers

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily, so a break in a container image or in a published OkHttp shows up
    # without anyone pushing to this repo. The four scheduled workflows are spread across
    # the day rather than started together — each one is now several jobs wide, and a
    # failure is easier to read against a quiet runner queue than against three other
    # suites' worth of containers.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      okhttpVersion:
        description: 'OkHttp version under test (e.g. 5.4.0, 5.5.0-SNAPSHOT)'
        required: false
        type: string

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  containers:
    name: containers (${{ matrix.okhttpVersion || 'pinned release' }}, JDK ${{ matrix.javaVersion }})
    runs-on: ubuntu-latest

    strategy:
      # Each version reports independently. One version failing must not cancel the
      # other's run, because the difference between them is the result we're after.
      fail-fast: false
      matrix:
        # An empty entry means the release pinned in libs.versions.toml.
        #
        # Push and pull request runs are about this repository, so they test that one
        # version. The scheduled and manual runs add the current snapshot: catching a
        # regression in an unreleased OkHttp before it ships is the point of running
        # daily against published artifacts. Bump the snapshot when OkHttp's main
        # branch moves to the next version.
        #
        # An explicit workflow_dispatch input overrides both and tests only what was asked for.
        okhttpVersion: >-
          ${{ fromJSON(
            inputs.okhttpVersion && format('["{0}"]', inputs.okhttpVersion)
            || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
                && '["", "5.5.0-SNAPSHOT"]')
            || '[""]'
          ) }}

        # The JDKs OkHttp's users are on, from the floor of what it supports to the current LTS.
        #
        # 8 is OkHttp's own baseline and now this repository's: nothing on the test classpath
        # disagrees — JUnit 5, Testcontainers, assertk and OkHttp are all Java 8 bytecode — and
        # `testJavaVersion` compiles for the target while running the tests on it, so Gradle's
        # own need for 17 doesn't set the floor. MockServer is the one exception, and the
        # suites that use it sit out the older rows; see containers/build.gradle.kts.
        #
        # 11 is the LTS a lot of applications are still on, 17 and 21 the ones most are on
        # today, and 25 the current LTS and the ceiling. 21 also matters for its own reason:
        # BasicLoomTest is `@EnabledForJreRange(min = JAVA_21)`, and JEP 491 changes its answer
        # on 24+, so the 21 and 25 rows are the before and after of that finding.
        #
        # Per-commit runs stay on one JDK: those runs are about this repository, and the
        # question of how a published OkHttp behaves across JDKs is a daily one.
        javaVersion: >-
          ${{ fromJSON(
            (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && '[8, 11, 17, 21, 25]'
            || '[21]'
          ) }}

        # The old JDKs test the release and not the snapshot. What they are asked is whether
        # the artifact people can depend on today still works where they are, which the release
        # answers; the snapshot exists to catch a regression before it ships, and that is worth
        # knowing on the JDKs a release would be adopted on.
        exclude:
          - okhttpVersion: '5.5.0-SNAPSHOT'
            javaVersion: 8
          - okhttpVersion: '5.5.0-SNAPSHOT'
            javaVersion: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          # Two of them. Gradle needs 17 or newer to run at all, so on the older rows the JDK
          # under test cannot also be the one running the build — 21 is JAVA_HOME because it is
          # last, and the toolchain named on the Gradle line below is what the suites are
          # compiled for and run on.
          java-version: |
            ${{ matrix.javaVersion }}
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run Container Tests
        # --continue so a failing container test doesn't stop loomTest from running:
        # every suite should report every run, whatever the others did.
        run: >
          ./gradlew containers:test containers:loomTest containers:hostileTest --continue
          -PtestJavaVersion=${{ matrix.javaVersion }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.javaVersion }}_X64,JAVA_HOME_21_X64
          ${{ matrix.okhttpVersion && format('-PokhttpVersion={0}', matrix.okhttpVersion) || '' }}

      # What the XML can't say: which OkHttp version 'pinned' actually resolved to, and
      # what the job as a whole did. The status page names the version under test, so it
      # has to be recorded by the run rather than guessed from the artifact name.
      - name: Record Run Metadata
        if: always()
        run: |
          version='${{ matrix.okhttpVersion }}'
          if [ -z "$version" ]; then
            version=$(sed -n 's/^okhttp = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          fi
          # What this actually ran on. Measured rather than written down: a runner image bump
          # or a toolchain change should show up on the status page as a different platform,
          # not as the same string next to different results.
          #
          # Asked of the JDK under test rather than of JAVA_HOME, which since the toolchain
          # split is the one running Gradle and would report the same platform for every row.
          java_home_variable="JAVA_HOME_${{ matrix.javaVersion }}_X64"
          props=$("${!java_home_variable}/bin/java" -XshowSettings:properties -version 2>&1)
          prop() { printf '%s\n' "$props" | sed -n "s/^ *$1 = //p" | head -1; }
          platform="$(prop java.vendor) JDK $(prop java.version) · $(prop os.arch)"

          mkdir -p containers/build/test-results
          cat > containers/build/test-results/run-metadata.json <<JSON
          {
            "workflow": "containers",
            "label": "${{ matrix.okhttpVersion || 'pinned' }}",
            "okhttpVersion": "$version",
            "platform": "$platform",
            "variant": "JDK ${{ matrix.javaVersion }}",
            "jobStatus": "${{ job.status }}",
            "runNumber": ${{ github.run_number }},
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "event": "${{ github.event_name }}",
            "finishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "taskFromPath": true
          }
          JSON

      # Both tasks' XML, including loomTest's, which records findings without failing
      # the build. The status page reads results from here, not from the job's colour.
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-test-results-${{ matrix.okhttpVersion || 'pinned' }}-jdk${{ matrix.javaVersion }}
          path: |
            containers/build/test-results/*/*.xml
            containers/build/test-results/tlspolicy-*.json
            containers/build/test-results/run-metadata.json
          retention-days: 30
