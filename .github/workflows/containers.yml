name: containers

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily, so a break in a container image or in a published OkHttp shows up
    # without anyone pushing to this repo.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      okhttpVersion:
        description: 'OkHttp version under test (e.g. 5.4.0, 5.5.0-SNAPSHOT)'
        required: false
        type: string

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  containers:
    name: containers (${{ matrix.okhttpVersion || 'pinned release' }})
    runs-on: ubuntu-latest

    strategy:
      # Each version reports independently. One version failing must not cancel the
      # other's run, because the difference between them is the result we're after.
      fail-fast: false
      matrix:
        # An empty entry means the release pinned in libs.versions.toml.
        #
        # Push and pull request runs are about this repository, so they test that one
        # version. The scheduled and manual runs add the current snapshot: catching a
        # regression in an unreleased OkHttp before it ships is the point of running
        # daily against published artifacts. Bump the snapshot when OkHttp's main
        # branch moves to the next version.
        #
        # An explicit workflow_dispatch input overrides both and tests only what was asked for.
        okhttpVersion: >-
          ${{ fromJSON(
            inputs.okhttpVersion && format('["{0}"]', inputs.okhttpVersion)
            || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
                && '["", "5.5.0-SNAPSHOT"]')
            || '[""]'
          ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run Container Tests
        # --continue so a failing container test doesn't stop loomTest from running:
        # every suite should report every run, whatever the others did.
        run: >
          ./gradlew containers:test containers:loomTest containers:hostileTest --continue
          ${{ matrix.okhttpVersion && format('-PokhttpVersion={0}', matrix.okhttpVersion) || '' }}

      # What the XML can't say: which OkHttp version 'pinned' actually resolved to, and
      # what the job as a whole did. The status page names the version under test, so it
      # has to be recorded by the run rather than guessed from the artifact name.
      - name: Record Run Metadata
        if: always()
        run: |
          version='${{ matrix.okhttpVersion }}'
          if [ -z "$version" ]; then
            version=$(sed -n 's/^okhttp = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          fi
          mkdir -p containers/build/test-results
          cat > containers/build/test-results/run-metadata.json <<JSON
          {
            "workflow": "containers",
            "label": "${{ matrix.okhttpVersion || 'pinned' }}",
            "okhttpVersion": "$version",
            "javaVersion": "21",
            "jobStatus": "${{ job.status }}",
            "runNumber": ${{ github.run_number }},
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "event": "${{ github.event_name }}",
            "finishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "taskFromPath": true
          }
          JSON

      # Both tasks' XML, including loomTest's, which records findings without failing
      # the build. The status page reads results from here, not from the job's colour.
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-test-results-${{ matrix.okhttpVersion || 'pinned' }}
          path: |
            containers/build/test-results/*/*.xml
            containers/build/test-results/run-metadata.json
          retention-days: 30
