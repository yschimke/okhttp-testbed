name: pages

# The status site is rebuilt whenever a test run finishes, not on a schedule of its own:
# the page exists to report the most recent run, and there is nothing new to say until
# one completes. Pushes to main rebuild it too, so a change to the site itself ships
# without waiting for tomorrow's tests.
on:
  workflow_run:
    workflows: [containers]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Reading the triggering run's artifacts.
  actions: read

# Never two deploys at once, and never cancel one half-done: the deployed site carries
# the run history, so a cancelled deploy would lose whatever it was about to publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Only runs that report on main get published. A pull request's containers run is
    # about the pull request; it must not overwrite the status of the repository.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.event != 'pull_request'
          && github.event.workflow_run.conclusion != 'cancelled'
          && github.event.workflow_run.conclusion != 'skipped')

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # A workflow_run knows which run triggered it; a manual or push-triggered build has
      # to go and find the most recent one. Either way the run's own metadata — number,
      # commit, event, finish time — is read back from the API, so the page describes the
      # run that produced the results rather than the build that rendered them.
      - name: Resolve Test Run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id='${{ github.event.workflow_run.id }}'
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow containers.yml --branch main --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No containers run to publish results from." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run view "$run_id" --json number,headSha,event,updatedAt,url > run.json
          {
            echo "found=true"
            echo "id=$run_id"
            echo "number=$(jq -r .number run.json)"
            echo "commit=$(jq -r .headSha run.json)"
            echo "event=$(jq -r .event run.json)"
            echo "finishedAt=$(jq -r .updatedAt run.json)"
            echo "url=$(jq -r .url run.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Download Test Results
        id: download
        if: steps.run.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: container-test-results-*
          path: artifacts
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      # The deployed site is its own datastore: the history published last time is fetched
      # back and appended to, so nothing about the run history is committed to the
      # repository. A 404 on the first ever deploy is expected and starts an empty history.
      - name: Fetch Published History
        if: steps.download.outcome == 'success'
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "${{ steps.pages.outputs.base_url }}/data/history.json" \
            -o previous-history.json \
          || echo "no published history yet; starting a new one"

      - name: Collect Results
        if: steps.download.outcome == 'success'
        run: |
          python3 site/tools/collect_results.py \
            --artifacts artifacts \
            --out site/data \
            --previous-history previous-history.json \
            --run-id '${{ steps.run.outputs.id }}' \
            --run-number '${{ steps.run.outputs.number }}' \
            --run-url '${{ steps.run.outputs.url }}' \
            --commit '${{ steps.run.outputs.commit }}' \
            --event '${{ steps.run.outputs.event }}' \
            --finished-at '${{ steps.run.outputs.finishedAt }}' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Artifacts expire after 30 days, so a site rebuild triggered by a documentation
      # change can find nothing to collect. Publishing what is already deployed keeps the
      # status on the page rather than blanking it.
      - name: Carry Forward Published Results
        if: steps.download.outcome != 'success'
        run: |
          mkdir -p site/data
          for file in latest.json history.json; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "${{ steps.pages.outputs.base_url }}/data/$file" \
              -o "site/data/$file" \
            || echo "no published $file to carry forward"
          done

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
