name: pages

# The status site is rebuilt whenever a test run finishes, not on a schedule of its own:
# the page exists to report the most recent results, and there is nothing new to say until
# a run completes. Pushes to main rebuild it too, so a change to the site itself ships
# without waiting for tomorrow's tests.
on:
  workflow_run:
    workflows: [containers, network, android-ech]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Reading the test workflows' artifacts.
  actions: read
  # Reading the open issues the roadmap section lists.
  issues: read

# Never two deploys at once, and never cancel one half-done: the deployed site carries the
# history, so a cancelled deploy would lose whatever it was about to publish. PR validation
# has its own per-branch group so it cannot hold up a production deployment.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pages-validation-{0}', github.ref)
        || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every workflow whose results the page reports. Each one's most recent completed run on
  # main is collected on every build, whichever of them triggered it — a containers run
  # finishing must not blank the ECH results, or the reverse.
  TEST_WORKFLOWS: containers.yml network.yml android-ech.yml

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate result collector
        run: python3 -m compileall -q site/tools

      - name: Validate JavaScript
        run: |
          for script in site/assets/*.js; do
            node --check "$script"
          done

  build-and-deploy:
    # Only runs that report on main get published. A pull request's test run is about the
    # pull request; it must not overwrite the status of the repository.
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_run'
          || (github.event.workflow_run.head_branch == 'main'
              && github.event.workflow_run.event != 'pull_request'
              && github.event.workflow_run.conclusion != 'cancelled'
              && github.event.workflow_run.conclusion != 'skipped'))

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # enablement creates the Pages site on the first run rather than requiring someone to
      # turn it on by hand: without it every build fails at this step with "Get Pages site
      # failed", and nothing is ever deployed. It is a no-op once the site exists.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      # Each test workflow's most recent completed run on main, downloaded into one
      # directory. The runs are independent and finish hours apart, so the page is always
      # assembled from several of them; each artifact carries the metadata saying which run
      # it came from and how old it is.
      - name: Download Test Results
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          found=false
          for workflow in $TEST_WORKFLOWS; do
            # The most recent run that actually carries results, not simply the most recent
            # one. Several things produce a completed run with no artifacts: the network
            # workflow's per-commit compile job, which deliberately runs no tests; a job that
            # died before its tests could report; a run old enough that its artifacts have
            # expired. Walking back a few runs finds the last real one instead of blanking a
            # workflow's results because the newest run had nothing to say.
            run_ids=$(gh run list --workflow "$workflow" --branch main --status completed \
              --limit 10 --json databaseId --jq '.[].databaseId')
            if [ -z "$run_ids" ]; then
              echo "no completed $workflow run on main yet"
              continue
            fi
            for run_id in $run_ids; do
              if gh run download "$run_id" --dir artifacts 2>/dev/null; then
                echo "collected $workflow run $run_id"
                found=true
                break
              fi
              echo "no artifacts on $workflow run $run_id"
            done
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # The deployed site is its own datastore: the history published last time is fetched
      # back and appended to, so nothing about it is committed to the repository. A 404 on
      # the first ever deploy is expected and starts an empty history.
      - name: Fetch Published History
        if: steps.download.outputs.found == 'true'
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "${{ steps.pages.outputs.base_url }}/data/history.json" \
            -o previous-history.json \
          || echo "no published history yet; starting a new one"

      - name: Collect Results
        if: steps.download.outputs.found == 'true'
        run: |
          python3 site/tools/collect_results.py \
            --artifacts artifacts \
            --out site/data \
            --previous-history previous-history.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Artifacts expire after 30 days, so a site rebuild triggered by a documentation
      # change can find nothing to collect. Publishing what is already deployed keeps the
      # status on the page rather than blanking it.
      - name: Carry Forward Published Results
        if: steps.download.outputs.found != 'true'
        run: |
          mkdir -p site/data
          for file in latest.json history.json; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "${{ steps.pages.outputs.base_url }}/data/$file" \
              -o "site/data/$file" \
            || echo "no published $file to carry forward"
          done

      # The roadmap section. Unconditional, unlike the results steps: it comes from the API
      # rather than from an artifact, so it is current on every build and survives a run that
      # collected no test results at all. A failure here is not worth losing a deploy over —
      # the page renders the section empty if the file is missing.
      - name: Collect Open Issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p site/data
          gh issue list --state open --limit 100 \
            --json number,title,url,labels,updatedAt \
            > site/data/issues.json
          echo "collected $(python3 -c 'import json,sys; print(len(json.load(open("site/data/issues.json"))))') open issue(s)"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5.0.0
