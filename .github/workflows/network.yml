name: network

# Deliberately not on push or pull request. These suites are guests on servers other people
# pay for — badssl asks to be treated as best-effort, nghttp2.org is one person's machine,
# How's My SSL asks to be used only for clients you control. Tying them to commits would mean
# a busy afternoon costs those servers dozens of runs to tell us the same thing the daily run
# already tells us once. So the tests run on a schedule, and on demand when someone wants an
# answer now.
#
# What still runs per commit is the compile job below, which touches nobody's server.
on:
  push:
    branches:
      - main
    paths:
      - 'network/**'
      - '.github/workflows/network.yml'
  pull_request:
    paths:
      - 'network/**'
      - '.github/workflows/network.yml'
  schedule:
    # Daily, so a change at one of the servers these tests call — or in a published
    # OkHttp — shows up without anyone pushing to this repo.
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      okhttpVersion:
        description: 'OkHttp version under test (e.g. 5.4.0, 5.5.0-SNAPSHOT)'
        required: false
        type: string

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  # Keeps the module honest between scheduled runs without calling anyone: a suite that stops
  # compiling, or that reaches into okhttp3.internal, is caught on the commit that did it
  # rather than the next morning. Everything here resolves from Maven Central and stops there.
  compile:
    name: compile
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Without this the Conscrypt suites are left out of the source set and a change that
      # breaks them compiles clean. Failure is not fatal here: a pull request that bumps the
      # pin has no release to fetch yet, and the conscrypt workflow is what builds that one.
      - name: Fetch Conscrypt
        continue-on-error: true
        run: conscrypt/fetch-conscrypt.sh

      - name: Compile Network Suites
        run: ./gradlew network:compileTestKotlin network:checkPublicApiOnly

  network:
    name: network (${{ matrix.okhttpVersion || 'pinned release' }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      # Each version reports independently. One version failing must not cancel the
      # other's run, because the difference between them is the result we're after.
      fail-fast: false
      matrix:
        # An empty entry means the release pinned in libs.versions.toml. This job only runs on
        # a schedule or on demand, and both cover the snapshot as well as the release — the
        # snapshot is what covers ECH at all, since the ECH API landed after 5.4.0 and the
        # suite is left out of the build on versions without it. An explicit dispatch input
        # overrides both and tests only what was asked for.
        okhttpVersion: >-
          ${{ fromJSON(
            inputs.okhttpVersion && format('["{0}"]', inputs.okhttpVersion)
            || '["", "5.5.0-SNAPSHOT"]'
          ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # The ECH suites' other half: a Conscrypt that can encrypt a client hello, which is not
      # published anywhere. Downloaded rather than built — the build is its own workflow, and
      # this one runs daily. A missing release leaves echConscryptTest out of the build and
      # the rest of the run unaffected, which is why this doesn't fail the job.
      - name: Fetch Conscrypt
        continue-on-error: true
        run: conscrypt/fetch-conscrypt.sh

      - name: Run Network Tests
        # No task here gates — all of them carry ignoreFailures, because everything here calls a
        # server someone else operates. --continue still earns its place: it covers the
        # failures that happen before a test runs, so one suite failing to compile or to
        # resolve doesn't rob the others of a result.
        run: >
          ./gradlew network:networkTest network:echTest network:echConscryptTest network:echPlatformTest --continue
          ${{ matrix.okhttpVersion && format('-PokhttpVersion={0}', matrix.okhttpVersion) || '' }}

      # What the XML can't say: which OkHttp version 'pinned' actually resolved to, and
      # what the job as a whole did. The status page names the version under test, so it
      # has to be recorded by the run rather than guessed from the artifact name.
      - name: Record Run Metadata
        if: always()
        run: |
          version='${{ matrix.okhttpVersion }}'
          if [ -z "$version" ]; then
            version=$(sed -n 's/^okhttp = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          fi
          # What this actually ran on. Measured rather than written down: a runner image bump
          # or a toolchain change should show up on the status page as a different platform,
          # not as the same string next to different results.
          props=$(java -XshowSettings:properties -version 2>&1)
          prop() { printf '%s\n' "$props" | sed -n "s/^ *$1 = //p" | head -1; }
          platform="$(prop java.vendor) JDK $(prop java.version) · $(prop os.arch)"

          mkdir -p network/build/test-results
          cat > network/build/test-results/run-metadata.json <<JSON
          {
            "workflow": "network",
            "label": "${{ matrix.okhttpVersion || 'pinned' }}",
            "okhttpVersion": "$version",
            "platform": "$platform",
            "jobStatus": "${{ job.status }}",
            "runNumber": ${{ github.run_number }},
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "event": "${{ github.event_name }}",
            "taskFromPath": true,
            "finishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      # Both tasks' XML. Neither fails the build, so the job's colour says nothing about the
      # results — the status page reads them from here, and shows them as findings.
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: network-test-results-${{ matrix.okhttpVersion || 'pinned' }}
          path: |
            network/build/test-results/*/*.xml
            network/build/test-results/endpoints-*.json
            network/build/test-results/clienthello-*.json
            network/build/test-results/run-metadata.json
          retention-days: 30
