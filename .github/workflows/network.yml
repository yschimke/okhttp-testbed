name: network

# Everything in this suite talks to a server someone else operates. It runs on the same
# events as `containers`, but its result is a finding rather than a gate: see
# `network/build.gradle.kts` and "Suites that report rather than gate" in the README.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily, offset from the container workflow so the two aren't competing for runners,
    # and so a rate limit hit by one isn't hit again minutes later by the other.
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      okhttpVersion:
        description: 'OkHttp version under test (e.g. 5.4.0, 5.5.0-SNAPSHOT)'
        required: false
        type: string

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  network:
    name: network (${{ matrix.okhttpVersion || 'pinned release' }})
    runs-on: ubuntu-latest

    strategy:
      # Each version reports independently, as in the containers workflow: the difference
      # between them is the result we're after.
      fail-fast: false
      matrix:
        # An empty entry means the release pinned in libs.versions.toml. The scheduled and
        # manual runs add the current snapshot; an explicit workflow_dispatch input
        # overrides both.
        okhttpVersion: >-
          ${{ fromJSON(
            inputs.okhttpVersion && format('["{0}"]', inputs.okhttpVersion)
            || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
                && '["", "5.5.0-SNAPSHOT"]')
            || '[""]'
          ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # No Docker here — what this job needs instead is outbound network, which is the one
      # thing the container jobs can take for granted and this one cannot.
      - name: Run Network Tests
        run: >
          ./gradlew network:networkTest
          ${{ matrix.okhttpVersion && format('-PokhttpVersion={0}', matrix.okhttpVersion) || '' }}

      # What the XML can't say: which OkHttp version 'pinned' actually resolved to, and
      # what the job as a whole did.
      - name: Record Run Metadata
        if: always()
        run: |
          version='${{ matrix.okhttpVersion }}'
          if [ -z "$version" ]; then
            version=$(sed -n 's/^okhttp = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          fi
          mkdir -p network/build/test-results
          cat > network/build/test-results/run-metadata.json <<JSON
          {
            "workflow": "network",
            "label": "${{ matrix.okhttpVersion || 'pinned' }}",
            "okhttpVersion": "$version",
            "javaVersion": "21",
            "jobStatus": "${{ job.status }}",
            "runNumber": ${{ github.run_number }},
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "event": "${{ github.event_name }}",
            "finishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "taskFromPath": true
          }
          JSON

      # The layout site/tools/collect_results.py understands: XML under a directory named
      # for the Gradle task that produced it, so `networkTest` is what classifies the
      # result as a finding rather than a failure.
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-test-results-${{ matrix.okhttpVersion || 'pinned' }}
          path: |
            network/build/test-results/*/*.xml
            network/build/test-results/run-metadata.json
          retention-days: 30
