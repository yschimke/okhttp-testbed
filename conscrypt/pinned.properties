# What `build-conscrypt.sh` builds, and what `fetch-conscrypt.sh` looks for.
#
# Pinned rather than tracked: the build takes about fifteen minutes and its output is
# cached as a release on this repository, so the pin is the cache key. Moving either sha
# means the next run rebuilds and publishes a new release. Bump them deliberately.

# google/conscrypt, branch google3-export. This is where ECH lives until it reaches a
# Conscrypt release: `Conscrypt.setEchConfigList(SSLSocket, byte[])` is public API here and
# exists in no published artifact. See README.md.
conscryptRef=d65d6b602c174408a6beaa9feab445fb500ce2bb
conscryptVersion=2.6-SNAPSHOT

# google/boringssl. Conscrypt builds its JNI library against BoringSSL's source tree; the
# upstream CI tracks main, which is why this is pinned here rather than left to float.
boringsslRef=3c31f33f61cdb22e48437c4347d17c6cebab1506
